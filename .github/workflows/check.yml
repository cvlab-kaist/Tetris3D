name: Check project page

on:
  push:
    branches: [page-source]
    paths: ['project-page/**', '.github/workflows/**']
  pull_request:
    paths: ['project-page/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-page
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: project-page/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chrome
      - run: npm run test:browser
